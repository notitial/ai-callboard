# Secret scan: calls the org's reusable gitleaks workflow, pinned by commit SHA. Read-only, no secrets.
# A public repo, so it runs on a GitHub-hosted runner (ubuntu-latest), never a self-hosted one.
name: Secret Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Secret Scan
    uses: notitial/.github/.github/workflows/gitleaks.yml@d50b3931bbd24755455427496804f6a96d9128d8  # 2026-11-15
    with:
      runs-on: '"ubuntu-latest"'
