# Claude PR review: calls ai-toolkit's reusable review kit at `@main`, so a kit change reaches this repo when it
# merges (the kit's README is tools/claude-review/README.md there). This file owns the triggers, the permission
# ceiling and the secrets the kit may use; each kit job narrows the ceiling with its own `permissions:`.
#
# Public repo, so every kit job runs on a GitHub-hosted runner (the kit's default, ubuntu-latest) and the
# SELF_HOSTED_REVIEW variable is ignored.
#
# Secrets are mapped by name, never `secrets: inherit`: the reviewer App's key and the Claude credential, nothing else.
# Never add another secret here.

name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude-review:
    permissions:
      contents: write
      pull-requests: write
      issues: read
    uses: notitial/ai-toolkit/.github/workflows/claude-review-kit.yml@main
    secrets:
      CLAUDE_REVIEW_APP_KEY: ${{ secrets.CLAUDE_REVIEW_APP_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
